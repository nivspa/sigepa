# Stack para colar no Portainer (ambiente PRD / Swarm).
# O Shepherd verifica o Docker Hub a cada 5 min e atualiza serviços que usam nivspa/sigepa:producao.
#
# No Portainer → stack → Environment variables (NÃO commitar token no Git):
#   DOCKERHUB_USER=nivspa
#   DOCKERHUB_TOKEN=<token do Docker Hub>
#
# Ou use Swarm Secrets e monte como arquivo — ver documentação do Shepherd.

version: "3.8"

services:
  shepherd:
    image: containrrr/shepherd:latest
    environment:
      SLEEP_TIME: 5m
      FILTER_SERVICES: name=sigepa_sigepa
      IGNORELIST_SERVICES: shepherd-sigepa_shepherd
      # OBRIGATÓRIO — evita "toomanyrequests" ao puxar do Docker Hub
      REGISTRY_USER: ${DOCKERHUB_USER:-nivspa}
      REGISTRY_PASSWORD: ${DOCKERHUB_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
