# Stack para Portainer (PRD / Swarm).
# FILTER_SERVICES precisa ser filtro do Docker: name=... ou label=...
# Ex.: name=sigepa_sigepa (nome exato do serviço no Swarm)

version: "3.8"

services:
  shepherd:
    image: containrrr/shepherd:latest
    environment:
      SLEEP_TIME: 5m
      FILTER_SERVICES: name=sigepa_sigepa
      IGNORELIST_SERVICES: shepherd-sigepa_shepherd
      # Se a imagem for PRIVADA no Docker Hub:
      # REGISTRY_USER: seu_usuario
      # REGISTRY_PASSWORD: token_dockerhub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
